name: 🤖 Auto-Scrape OS Catalog

on:
  schedule:
    # Every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run OS Catalog Scraper
        run: node scripts/scraper.js

      - name: Check for Changes
        id: changes
        run: |
          git diff --quiet catalog.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & Push Updated Catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "OSwitch Bot"
          git config user.email "bot@osswitch.app"
          git add catalog.json
          git commit -m "🤖 Auto-update: Fresh OS ISO URLs [$(date +'%Y-%m-%d')]"
          git push
