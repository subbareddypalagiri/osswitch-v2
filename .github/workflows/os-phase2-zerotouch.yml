name: Phase 2 Zero-Touch Matrix (Proof of Concept)

on: workflow_dispatch

jobs:
  zerotouch-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install QEMU and Cloud-Init Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils curl
          
      - name: Pre-Flight Check & Download Ubuntu 24.04 Server ISO
        run: |
          URL="https://releases.ubuntu.com/24.04/ubuntu-24.04.4-live-server-amd64.iso"
          echo "Running 2-Second Pre-Flight Check on URL..."
          
          # 1. Ping for HTTP 200
          HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" -I "$URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::PRE-FLIGHT FAILED! URL is dead (HTTP $HTTP_STATUS). Stopping before QEMU hangs."
            exit 1
          fi
          
          # 2. Ping for File Size (Must be > 1GB)
          FILE_SIZE=$(curl -sLI "$URL" | grep -i Content-Length | tail -n 1 | awk '{print $2}' | tr -d '\r')
          echo "Detected File Size: $FILE_SIZE bytes"
          if [ -z "$FILE_SIZE" ] || [ "$FILE_SIZE" -lt 1000000000 ]; then
             echo "::error::PRE-FLIGHT FAILED! File is only $FILE_SIZE bytes. This is an HTML error page, not an OS ISO."
             exit 1
          fi
          
          echo "✅ Pre-Flight Passed! ISO is valid and >1GB. Proceeding with download..."
          curl -L -o ubuntu.iso "$URL"
          
      - name: Generate Cloud-Init Seed Image
        run: |
          cloud-localds seed.img .github/autoinstall/user-data .github/autoinstall/meta-data
          
      - name: Create 10GB Virtual Hard Drive
        run: |
          qemu-img create -f qcow2 hdd.img 10G
          
      - name: Execute Zero-Touch Silent Installation
        timeout-minutes: 45
        run: |
          echo "Starting QEMU with Ubuntu ISO, Seed Image, and 10GB HDD..."
          # -no-reboot ensures QEMU exits when the autoinstall script calls 'poweroff'
          # -display none because we don't have a GUI in GitHub Actions
          # -m 3072 gives it 3GB of RAM to speed up the install
          sudo qemu-system-x86_64 \
            -m 3072 \
            -smp 2 \
            -cdrom ubuntu.iso \
            -drive file=seed.img,format=raw,if=virtio \
            -drive file=hdd.img,format=qcow2,if=virtio \
            -display none \
            -no-reboot

      - name: Verify Installation Success
        run: |
          echo "Installation completed and VM powered off automatically."
          echo "Verifying virtual hard drive..."
          ls -lh hdd.img
          qemu-img info hdd.img
          echo "✅ ZERO-TOUCH INSTALLATION PROOF OF CONCEPT SUCCESSFUL!"
